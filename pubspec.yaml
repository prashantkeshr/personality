name: personality
description: "Personality - private personal wellness and style OS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  sqlite3: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# Encrypted SQLite: SQLite3MultipleCiphers (MIT, no OpenSSL). The sqlite3
# build hook downloads a prebuilt binary and checks its sha256.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true
